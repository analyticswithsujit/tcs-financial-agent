version: "3.9"

services:
  db:
    image: mysql:8.0
    container_name: tcs_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-tcsagent2024}
      MYSQL_DATABASE: ${MYSQL_DB:-tcs_forecast}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_PASSWORD:-tcsagent2024}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: tcs_forecast_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      MYSQL_HOST: db
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/app/chroma_db
      - doc_cache:/app/doc_cache

volumes:
  mysql_data:
  chroma_data:
  doc_cache:
